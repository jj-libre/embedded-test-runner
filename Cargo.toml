[workspace]
resolver = "2"
members = [
    "embedded-test-host-runner",
    "embedded-test-qemu-runner",
    "embedded-test-renode-runner",
    "embedded-test-runner-core",
    "test-util",
    "xtask",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jj-libre/embedded-test-runner"
homepage = "https://github.com/jj-libre/embedded-test-runner"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
elided_lifetimes_in_paths = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"

[workspace.dependencies]
embedded-test-runner-core = { path = "embedded-test-runner-core", version = "0.1.0" }
test-util = { path = "test-util" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
libtest-mimic = "0.8"
object = "0.40"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
tempfile = "3"
thiserror = "2"
walkdir = "2"
wait-timeout = "0.2"
